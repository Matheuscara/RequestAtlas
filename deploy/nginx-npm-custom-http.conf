# Opcional: publicar o logsNPM pelo próprio NPM numa porta interna, em /data/nginx/custom/http.conf.
# Alternativa mais simples: criar um Proxy Host no NPM apontando para 127.0.0.1:7881 com Access List.
server {
    listen 7880;
    allow 192.168.0.0/16;
    deny all;
    access_log off;   # o painel não polui os logs que analisa
    location / {
        proxy_pass http://127.0.0.1:7881;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
