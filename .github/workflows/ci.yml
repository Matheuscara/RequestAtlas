name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: smoke (demo data)
        run: |
          python scripts/gen_demo.py /tmp/demo --days 8
          python -m requestatlas ingest --config /tmp/demo/requestatlas.toml
          python -m requestatlas check --config /tmp/demo/requestatlas.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check requestatlas/web/app.js && node --check requestatlas/web/i18n.js
