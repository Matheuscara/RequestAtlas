# RequestAtlas ao lado do Nginx Proxy Manager. Tudo é ajustado no .env:
#   cp .env.example .env   # defina pelo menos REQUESTATLAS_NPM_DATA
#   docker compose up -d
# Requer Docker Compose v2.24+ (env_file opcional).
#
# Padrão privado: a porta é publicada só em 127.0.0.1 do host. Para expor na rede,
# mude REQUESTATLAS_BIND e ative a autenticação (veja .env.example e README).
services:
  requestatlas:
    image: ${REQUESTATLAS_IMAGE:-ghcr.io/matheuscara/requestatlas:latest}
    # Sem a imagem no registro (ex.: REQUESTATLAS_IMAGE=requestatlas:local) ou com `up --build`, compila daqui.
    build: .
    restart: unless-stopped
    # UID:GID do processo: precisa LER os arquivos do NPM e ESCREVER no volume de dados.
    user: "${REQUESTATLAS_UID:-10001}:${REQUESTATLAS_GID:-10001}"
    # Variáveis do app (REQUESTATLAS_*, REQUESTATLAS__SEÇÃO__CHAVE) vêm do mesmo .env; só as descomentadas valem.
    env_file:
      - path: .env
        required: false
    environment:
      # Fixos: casam com `ports:` e com o volume de dados abaixo. Troque a porta do HOST, não esta.
      REQUESTATLAS_LISTEN: 0.0.0.0
      REQUESTATLAS_PORT: "7881"
      REQUESTATLAS_DATA_DIR: /var/lib/requestatlas
    ports:
      - "${REQUESTATLAS_BIND:-127.0.0.1}:${REQUESTATLAS_HOST_PORT:-7881}:7881"
    volumes:
      # Do /data do NPM só o necessário, somente leitura: logs/, database.sqlite e nginx/ (custom/).
      # Ficam de fora keys.json, custom_ssl/ e access/. Os caminhos precisam existir no host.
      - type: bind
        source: "${REQUESTATLAS_NPM_DATA:?defina REQUESTATLAS_NPM_DATA no .env (diretório que o NPM monta em /data)}/logs"
        target: /npm/logs
        read_only: true
        bind:
          create_host_path: false
      # NPM com MySQL/MariaDB/Postgres não tem este arquivo: REQUESTATLAS_NPM_DB_FILE=/dev/null (domínios e
      # regras de 403 passam a vir só de [sites.ID] no requestatlas.toml).
      - type: bind
        source: "${REQUESTATLAS_NPM_DB_FILE:-${REQUESTATLAS_NPM_DATA}/database.sqlite}"
        target: /npm/database.sqlite
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${REQUESTATLAS_NPM_DATA}/nginx"
        target: /npm/nginx
        read_only: true
        bind:
          create_host_path: false
      # Banco próprio do RequestAtlas: volume nomeado (padrão) ou diretório do host (./data, /srv/requestatlas).
      - ${REQUESTATLAS_DATA_VOLUME:-requestatlas-data}:/var/lib/requestatlas
      # Opcional, somente leitura: requestatlas.toml, arquivo de senha, GeoLite2. Diretório vazio = padrões.
      - ${REQUESTATLAS_CONFIG_DIR:-./config}:/etc/requestatlas:ro
      # Opcional, somente leitura: GeoLite2-City.mmdb / GeoLite2-ASN.mmdb (padrão: o diretório de config).
      - ${REQUESTATLAS_GEOIP_DIR:-${REQUESTATLAS_CONFIG_DIR:-./config}}:/geoip:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Para publicar pelo próprio NPM (Proxy Host -> http://requestatlas:7881), entre na rede dele:
    # networks: [default, npm]

# networks:
#   npm:
#     external: true
#     name: npm_default   # `docker network ls` — a rede do container do NPM

volumes:
  requestatlas-data:
