[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "requestatlas"
dynamic = ["version"]
description = "Painel de análise dos access logs do Nginx Proxy Manager: bots, status, páginas e origem."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
geoip = ["maxminddb>=2.0"]

[project.scripts]
requestatlas = "requestatlas.__main__:main"

[tool.setuptools]
packages = ["requestatlas"]

[tool.setuptools.dynamic]
version = { attr = "requestatlas.__version__" }

[tool.setuptools.package-data]
requestatlas = ["web/*", "web/vendor/*"]
